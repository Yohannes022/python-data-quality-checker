[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-quality-checker"
version = "1.0.0"
description = "A command-line tool for profiling and detecting data quality issues in CSV datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4.0",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[project.scripts]
data-quality = "data_quality_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
