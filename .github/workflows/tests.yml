
name: Python Tests

on:
  push:
    paths:
      - "projects/python-data-quality-checker/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "projects/python-data-quality-checker/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/python-data-quality-checker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
